<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script>
    // GitHub Pages 404 trick — redirect clean URLs back to SPA
    var path = window.location.pathname;
    var mArt = path.match(/^\/articles\/([^/]+)\/?$/);
    var mMatch = path.match(/^\/matchs\/([^/]+)\/?$/);
    var mLeague = path.match(/^\/(nhl|nfl|nba|mlb)\/?$/i);
    if (mArt) {
      window.location.replace('/?article=' + mArt[1]);
    } else if (mMatch) {
      window.location.replace('/?match=' + mMatch[1]);
    } else if (mLeague) {
      window.location.replace('/?page=' + mLeague[1].toLowerCase());
    } else {
      window.location.replace('/');
    }
  </script>
</head>
<body></body>
</html>
